[build]
  base = "frontend"
  command = "npm ci && npm run build -- --configuration production"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular routes are client-side, so every path must serve index.html rather
# than 404 on a deep link such as /companies/CO-0173.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
