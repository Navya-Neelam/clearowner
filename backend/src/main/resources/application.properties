spring.application.name=clearowner

# Connection details come from the environment. Never hardcode them here.
cognodb.uri=${COGNODB_URI:}
cognodb.user=${COGNODB_USER:cognodb}
cognodb.password=${COGNODB_PASSWORD:}

# Comma-separated browser origins permitted to call this API.
clearowner.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.port=${PORT:8080}

# Keep our own error shape; never leak stack traces to clients.
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.ai.clearowner=INFO
logging.level.org.neo4j.driver=WARN
