# Tests must run on a clean checkout with no credentials available.
# The Neo4j driver does not open a connection when it is constructed, so a
# placeholder URI is enough for the application context to start. No test in
# this suite talks to a database.
cognodb.uri=bolt://localhost:7687
cognodb.user=test
cognodb.password=test
clearowner.cors.allowed-origins=http://localhost:4200
